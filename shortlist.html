<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Liste des candidats enregistrés dans la shortlist DevScope.">
    <title>DevScope - Shortlist</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen flex-col bg-slate-100 text-slate-800">

    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex w-full max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-3">

            <a href="index.html" class="text-lg font-bold text-slate-900">DevScope</a>

            <nav aria-label="Navigation principale">
                <ul class="flex flex-wrap items-center gap-4 text-sm">
                    <li>
                        <a href="index.html" class="text-slate-600 hover:text-slate-900">Recherche</a>
                    </li>
                    <li>
                        <a href="profil.html" class="text-slate-600 hover:text-slate-900">Profil</a>
                    </li>
                    <li>
                        <a href="shortlist.html" aria-current="page" class="font-semibold text-slate-900">Shortlist</a>
                    </li>
                </ul>
            </nav>

            <p id="ratelimit" class="text-xs text-slate-500">GitHub : —</p>

        </div>
    </header>

    <main id="main" class="flex-1 px-4 py-6">
        <div class="mx-auto w-full max-w-3xl">

            <div class="flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
                <h1 class="text-xl font-bold text-slate-900">Shortlist</h1>
                <p id="count" class="text-sm text-slate-500">0 candidat</p>
            </div>

            <div class="mt-4 flex flex-col gap-2 sm:flex-row">
                <div class="flex-1">
                    <label for="search-input" class="sr-only">Chercher un candidat</label>
                    <input type="text" id="search-input" placeholder="Nom ou login" autocomplete="off"
                        class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none">
                </div>

                <div>
                    <label for="sort-select" class="sr-only">Trier les candidats</label>
                    <select id="sort-select"
                        class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-slate-500 focus:outline-none sm:w-48">
                        <option value="recent">Plus récent</option>
                        <option value="name">Nom</option>
                        <option value="oldest">Plus ancien</option>
                    </select>
                </div>
            </div>

            <div id="loading" class="mt-8 text-center text-sm text-slate-500" role="status">
                <p>Chargement...</p>
            </div>

            <div id="error" class="mt-6 hidden rounded border border-red-200 bg-red-50 p-4" role="alert">
                <p id="error-message" class="text-sm text-red-700"></p>
                <button id="retry-btn" type="button"
                    class="mt-3 rounded border border-red-300 bg-white px-3 py-2 text-sm text-red-700 hover:bg-red-100">
                    Réessayer
                </button>
            </div>

            <p id="empty" class="mt-8 hidden text-center text-sm text-slate-500"></p>

            <div id="candidates-list" class="mt-4 flex flex-col gap-2"></div>

        </div>
    </main>

    <script type="module" src="js/shortlist.js"></script>

</body>

</html>
