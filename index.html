<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevScope : recherche un développeur GitHub et garde une shortlist de candidats.">
    <title>DevScope - Recherche</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen flex-col bg-slate-100 text-slate-800">

    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex w-full max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-3">

            <a href="index.html" class="text-lg font-bold text-slate-900">DevScope</a>

            <nav aria-label="Navigation principale">
                <ul class="flex flex-wrap items-center gap-4 text-sm">
                    <li>
                        <a href="index.html" aria-current="page" class="font-semibold text-slate-900">Recherche</a>
                    </li>
                    <li>
                        <a href="profil.html" class="text-slate-600 hover:text-slate-900">Profil</a>
                    </li>
                    <li>
                        <a href="shortlist.html" class="text-slate-600 hover:text-slate-900">Shortlist</a>
                    </li>
                </ul>
            </nav>

            <p id="ratelimit" class="text-xs text-slate-500">GitHub : —</p>

        </div>
    </header>

    <main id="main" class="flex-1 px-4 py-6">
        <div class="mx-auto w-full max-w-4xl">

            <div class="mx-auto max-w-md rounded border border-slate-200 bg-white p-5">
                <h1 class="text-xl font-bold text-slate-900">Rechercher un développeur</h1>

                <form id="search-form" class="mt-4" novalidate>
                    <label for="username-input" class="block text-sm text-slate-700">Nom d'utilisateur</label>
                    <input type="text" id="username-input" name="username" placeholder="Ex. torvalds" autocomplete="off"
                        aria-describedby="username-error"
                        class="mt-1 w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none">

                    <p id="username-error" class="mt-1 hidden text-sm text-red-600" role="alert"></p>

                    <button type="submit"
                        class="mt-3 w-full rounded bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
                        Analyser
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script type="module" src="js/search.js"></script>

</body>

</html>
